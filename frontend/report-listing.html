<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniMart | Report a Listing</title>
  <link rel="stylesheet" href="css/index.css">
  <style>
    .report-card {
      max-width: 600px;
      margin: 40px auto 80px auto;
      padding: 40px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .report-title {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      color: var(--text);
    }
    .report-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 32px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 24px;
    }
    .form-label {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--text);
    }
    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--background);
      color: var(--text);
      transition: var(--transition);
      outline: none;
    }
    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }
    .form-input::placeholder {
      color: var(--text-muted);
      opacity: 0.7;
    }
    .form-select {
      cursor: pointer;
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>

  <div id="navbar-placeholder"></div>

  <main class="app-main">
    <div class="report-card">
      <h1 class="report-title">Report a Listing</h1>
      <p class="report-desc">
        Help us keep the campus community safe. If you find a listing that violates our guidelines, is fraudulent, or contains prohibited items, please fill out the form below.
      </p>

      <form id="report-form">
        <!-- Product Identifier -->
        <div class="form-group">
          <label class="form-label" for="product-name">Product Name / Title</label>
          <input type="text" id="product-name" class="form-input" placeholder="e.g., Dell Laptop (or copy the product link)" required>
          <input type="hidden" id="product-id" value="">
        </div>

        <!-- Violation Reason -->
        <div class="form-group">
          <label class="form-label" for="report-reason">Reason for Report</label>
          <select id="report-reason" class="form-input form-select" required>
            <option value="" disabled selected>Select a reason...</option>
            <option value="Fraud">Suspicious or Fraudulent Listing</option>
            <option value="Prohibited">Prohibited Items (Weapons, Drugs, etc.)</option>
            <option value="Spam">Spam, Duplicates, or Miscategorized Listing</option>
            <option value="Harassment">Harassment, Abuse, or Offensive Content</option>
            <option value="Other">Other Violation</option>
          </select>
        </div>

        <!-- Detailed Description -->
        <div class="form-group">
          <label class="form-label" for="report-detail">Additional Details</label>
          <textarea id="report-detail" class="form-input" rows="5" placeholder="Please provide specific details to help our moderators review this listing..." required style="resize:vertical;"></textarea>
        </div>

        <!-- Reporter Email -->
        <div class="form-group">
          <label class="form-label" for="reporter-email">Your Verified Email</label>
          <input type="email" id="reporter-email" class="form-input" placeholder="Your college email..." required readonly>
          <small style="color:var(--text-muted); font-size:0.75rem; margin-top:2px;">Logged-in student verification email.</small>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary btn-submit">Submit Violation Report</button>
      </form>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Check auth status
      if (!API.auth.isAuthenticated()) {
        showToast('Please login to report listings', 'warning');
        setTimeout(() => {
          window.location.href = 'login.html?redirect=report-listing.html';
        }, 1500);
        return;
      }

      // Populate reporter email
      const user = API.auth.getCurrentUser();
      if (user && user.email) {
        document.getElementById('reporter-email').value = user.email;
      }

      // Resolve query parameters (prefilled product id)
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get('id');

      if (productId) {
        try {
          const res = await API.products.getOne(productId);
          if (res.success && res.data) {
            document.getElementById('product-name').value = res.data.title;
            document.getElementById('product-id').value = res.data._id;
            // Disable editing item title if loaded dynamically to prevent mistake
            document.getElementById('product-name').readOnly = true;
            document.getElementById('product-name').style.opacity = '0.7';
          }
        } catch (err) {
          console.error('Failed to pre-fetch reported listing:', err);
        }
      }

      // Handle submit
      const form = document.getElementById('report-form');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        
        const productName = document.getElementById('product-name').value;
        const reason = document.getElementById('report-reason').value;
        const details = document.getElementById('report-detail').value;

        // Perform reporting toast notification trigger
        showToast(`Report for "${productName}" submitted successfully! Our moderators will review it.`, 'success');
        
        // Reset form
        form.reset();
        
        // Populate reporter email back
        if (user && user.email) {
          document.getElementById('reporter-email').value = user.email;
        }

        // Redirect home after 2 seconds
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 2000);
      });
    });
  </script>
</body>
</html>
