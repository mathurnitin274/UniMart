<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | UniMart</title>
  <link rel="stylesheet" href="css/index.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <div id="navbar-placeholder"></div>

  <main class="app-main" style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 180px);">
    <div class="glass-card" style="width: 100%; max-width: 440px; padding: 40px; text-align: center;">
      <h2 style="font-size: 2rem; font-weight: 700; margin-bottom: 8px;">Welcome Back</h2>
      <p style="color: var(--text-muted); margin-bottom: 32px; font-size: 0.95rem;">Enter your credentials to access UniMart</p>

      <form id="login-form">
        <div class="form-group" style="text-align: left;">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="yourname@example.com" required>
        </div>

        <div class="form-group" style="text-align: left; margin-bottom: 24px;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label for="password" class="form-label">Password</label>
          </div>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; font-size: 1rem; border-radius: var(--radius-sm); margin-bottom: 16px;">
          Sign In
        </button>

        <div style="display: flex; align-items: center; text-align: center; margin-bottom: 16px; color: var(--text-muted); font-size: 0.85rem;">
          <div style="flex: 1; border-bottom: 1px solid var(--border);"></div>
          <span style="padding: 0 10px;">or</span>
          <div style="flex: 1; border-bottom: 1px solid var(--border);"></div>
        </div>

        <div id="google-login-button-container" style="margin-bottom: 24px; display: flex; justify-content: center; width: 100%;"></div>
      </form>

      <p style="color: var(--text-muted); font-size: 0.9rem;">
        Don't have an account? <a href="register.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">Create one here</a>
      </p>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
